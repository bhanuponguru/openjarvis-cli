name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout repository (full history for VCS versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --group docs --group build --python ${{ matrix.python-version }}

      - name: Run Ruff linting
        run: uv run ruff check .

      - name: Run Mypy static type checking
        run: uv run mypy

      - name: Run Pytest test suite
        run: uv run pytest -q

      - name: Verify Documentation Build
        run: uv run mkdocs build --strict

      - name: Verify Package Wheel & Sdist Build
        run: uv build

  build-binary:
    name: Test Standalone Binary Compilation (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history for VCS versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install build dependencies
        run: uv sync --group build --python 3.13

      - name: Compile standalone executable via PyInstaller
        run: bash scripts/build-binary.sh

      - name: Test standalone executable execution
        run: |
          chmod +x dist/openjarvis
          ./dist/openjarvis --version
          ./dist/openjarvis --help
