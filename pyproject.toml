[project]
name = "openjarvis"
version = "0.2.0"
description = "OpenJarvis — client-side orchestrator routing requests across a team of LLMs over any LangChain-supported provider"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.25",
    "ddgs>=9.0",
    "pytz>=2024.1",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-ollama",
]

[project.scripts]
openjarvis = "openjarvis.cli:run_cli"
oj = "openjarvis.cli:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openjarvis"]
