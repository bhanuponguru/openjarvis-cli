[project]
name = "openjarvis-cli"
dynamic = ["version"]
description = "OpenJarvis CLI — Autonomous agentic orchestration client and terminal interface routing tasks across LLMs"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Bhanu Ponguru", email = "bhanuponguru@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.25",
    "ddgs>=9.0",
    "pytz>=2024.1",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-ollama",
]
keywords = [
    "ai",
    "agents",
    "llm",
    "orchestration",
    "langgraph",
    "cli",
    "terminal",
    "multi-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Interpreters",
    "Topic :: System :: Shells",
]

[project.urls]
Homepage = "https://github.com/bhanuponguru/openjarvis-cli"
Documentation = "https://bhanuponguru.tech/openjarvis-cli"
Repository = "https://github.com/bhanuponguru/openjarvis-cli"
Issues = "https://github.com/bhanuponguru/openjarvis-cli/issues"

[project.scripts]
openjarvis = "openjarvis.cli:run_cli"
oj = "openjarvis.cli:run_cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "respx>=0.22.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
build = [
    "cython>=3.2.0",
    "pyinstaller>=6.0",
    "setuptools>=70.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/openjarvis/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openjarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001"]

[tool.mypy]
files = ["src"]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
